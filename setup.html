<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Set up workspace · GovernanceGuard</title>
  <style>
    :root { color-scheme: light; font: 15px/1.5 Inter, ui-sans-serif, system-ui, sans-serif; color: #182438; background: #f5f7fb; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; display: grid; place-items: center; padding: 20px; }
    main { width: min(440px, 100%); background: white; border: 1px solid #e8edf3; border-radius: 14px; padding: 30px; box-shadow: 0 12px 40px #17253b12; }
    h1 { margin: 0 0 4px; font-size: 23px; }
    p { margin: 0 0 22px; color: #78869a; font-size: 13px; }
    label { display: block; margin: 14px 0 6px; font-size: 12px; font-weight: 650; }
    input { width: 100%; height: 42px; border: 1px solid #dce3ec; border-radius: 7px; padding: 0 11px; font: inherit; }
    input:focus { outline: 2px solid #9db8f4; border-color: #4778e8; }
    button { width: 100%; margin-top: 20px; height: 40px; border: 0; border-radius: 7px; background: #4778e8; color: white; font: inherit; font-weight: 650; cursor: pointer; }
    #message { min-height: 22px; margin-top: 12px; color: #b43f4c; font-size: 12px; }
    .brand { margin-bottom: 22px; color: #4778e8; font-size: 11px; font-weight: 750; letter-spacing: 1.1px; text-transform: uppercase; }
    .brand-logo { display: block; width: 170px; height: 170px; margin: 0 auto 18px; border-radius: 10px; object-fit: cover; }
    footer { margin-top: 18px; color: #78869a; font-size: 10px; text-align: center; }
  </style>
</head>
<body>
  <main>
    <img class="brand-logo" src="/assets/governanceguard-logo.png" alt="Governance Guard shield logo">
    <h1>Set up your workspace</h1>
    <p>Create the first administrator account. Setup closes automatically after the account is created.</p>
    <form id="setup-form">
      <label for="display-name">Administrator name</label>
      <input id="display-name" name="display_name" autocomplete="name" required maxlength="120">
      <label for="email">Administrator email</label>
      <input id="email" name="email" type="email" autocomplete="username" required maxlength="254">
      <label for="password">Password (12 characters minimum)</label>
      <input id="password" name="password" type="password" autocomplete="new-password" required minlength="12" maxlength="256">
      <button type="submit">Create administrator</button>
      <div id="message" role="alert" aria-live="polite"></div>
    </form>
    <footer>Made by Vishal Chaudhary</footer>
  </main>
  <script>
    document.getElementById("setup-form").addEventListener("submit", async event => {
      event.preventDefault();
      const form = event.currentTarget;
      const message = document.getElementById("message");
      message.textContent = "";
      try {
        const response = await fetch("/api/auth/setup", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(Object.fromEntries(new FormData(form).entries()))
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.error || "Workspace setup failed.");
        location.assign("/");
      } catch (error) {
        message.textContent = error.message;
      }
    });
  </script>
</body>
</html>
