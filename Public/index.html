<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CyberVendor - Admin & Vendor Portal</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <style>
        :root { --primary: #1e40af; --bg: #f1f5f9; --card: #ffffff; --border: #cbd5e1; --high: #ef4444; --low: #10b981; }
        body { font-family: 'Segoe UI', system-ui, sans-serif; background: var(--bg); margin: 0; padding: 20px; color: #1e293b; }
        .container { max-width: 1400px; margin: auto; }
        .card { background: var(--card); padding: 20px; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 20px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .nav-bar { display: flex; justify-content: space-between; align-items: center; background: #1e293b; color: white; padding: 10px 20px; border-radius: 8px; margin-bottom: 20px; }
        .role-btn { background: #334155; color: white; border: 1px solid #475569; padding: 5px 15px; border-radius: 4px; cursor: pointer; font-size: 0.8rem; }
        .role-btn.active { background: var(--primary); border-color: var(--primary); }
        #adminLoginCard { max-width: 400px; margin: 50px auto; text-align: center; }
        .login-input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid var(--border); border-radius: 6px; box-sizing: border-box; }
        .dash-flex { display: flex; gap: 15px; margin-bottom: 20px; }
        .stat-box { flex: 1; background: #fff; padding: 15px; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .template-panel { background: #eff6ff; border: 1px solid #bfdbfe; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        .vendor-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; margin-bottom: 20px; }
        .vendor-card { padding: 15px; background: #fff; border: 1px solid var(--border); border-radius: 8px; cursor: pointer; transition: 0.2s; position: relative; }
        .vendor-card.active { border: 2px solid var(--primary); background: #f0f9ff; }
        .check-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 10px; max-height: 200px; overflow-y: auto; background: white; padding: 10px; border: 1px solid #ddd; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { background: #f8fafc; text-align: left; padding: 12px; border-bottom: 2px solid var(--border); font-size: 0.85rem; text-transform: uppercase; }
        td { padding: 12px; border-bottom: 1px solid #e2e8f0; vertical-align: top; font-size: 0.9rem; }
        .btn { padding: 10px 18px; border-radius: 6px; border: none; cursor: pointer; font-weight: 600; display: inline-flex; align-items: center; gap: 8px; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: #059669; color: white; }
        .btn-danger { background: var(--high); color: white; padding: 5px 10px; font-size: 0.7rem; }
        .btn-edit { background: #f59e0b; color: white; padding: 4px 8px; font-size: 0.7rem; margin-left: 8px; }
        .q-id { font-family: monospace; font-weight: bold; color: var(--primary); background: #dbeafe; padding: 2px 4px; border-radius: 4px; font-size: 0.75rem; }
        .hidden { display: none; }
        textarea { font-family: inherit; resize: vertical; min-height: 50px; border: 1px solid var(--border); border-radius: 4px; width: 100%; padding: 8px; box-sizing: border-box; }
        .control-q { font-style: italic; color: #64748b; margin-top: 5px; display: block; font-size: 0.85rem; }
        .question-item { display: flex; align-items: center; gap: 8px; padding: 6px; border-radius: 4px; }
        .question-item:hover { background: #f8fafc; }
    </style>
</head>
<body>
<div class="container">
    <div class="nav-bar">
        <span>🛡️ CyberVendor Enterprise</span>
        <div>
            <button id="btnVendorView" class="role-btn active" onclick="setView('vendor')">Vendor Access</button>
            <button id="btnAdminView" class="role-btn" onclick="setView('admin')">Admin Portal</button>
        </div>
    </div>

    <div id="adminLoginCard" class="card hidden">
        <h3>🔒 Admin Authentication</h3>
        <input type="password" id="adminPassInput" class="login-input" placeholder="Enter Admin Password">
        <button class="btn btn-primary" style="width: 100%; justify-content: center;" onclick="checkAdminAuth()">Login</button>
    </div>

    <div id="adminSection" class="hidden">
        <div class="dash-flex">
            <div class="stat-box">Total Vendors: <b id="stat-count">0</b></div>
            <div class="stat-box">Portfolio Average: <b id="stat-avg">0%</b></div>
        </div>

        <div class="card template-panel">
            <h3>1. Template Builder</h3>
            <div id="masterChecklist" class="check-list"></div>
            <div style="margin-top:10px; display:flex; gap:10px;">
                <input type="text" id="tplName" placeholder="Template Name" style="flex:1; padding:8px;">
                <button class="btn btn-primary" onclick="saveTemplate()">💾 Save Template</button>
            </div>
            <div id="savedTemplates" style="margin-top:10px; display:flex; gap:5px; flex-wrap:wrap;"></div>
        </div>

        <div class="card">
            <h3>2. Vendor Inventory</h3>
            <div id="vendorGrid" class="vendor-grid"></div>
            <div style="display:flex; gap:10px;">
                <input type="text" id="vName" placeholder="Company Name" style="flex:1; padding:10px;">
                <button class="btn btn-primary" onclick="addVendor()">+ Register Vendor</button>
            </div>
        </div>
    </div>

    <div id="vendorSelection" class="card">
        <h3>Vendor Login</h3>
        <select id="vendorPicker" onchange="loadAudit(this.value)" style="width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--border);">
            <option value="">-- Select Your Organization --</option>
        </select>
    </div>

    <div id="workspace" class="card" style="display:none;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h2 id="currentTitle">Audit</h2>
            <div id="adminControls" class="hidden">
                <button class="btn btn-danger" onclick="deleteVendor()">🗑️ Delete Vendor</button>
                <button class="btn btn-primary" onclick="exportVendorData()">📊 Export PDF</button>
            </div>
        </div>
        <p>Questionnaire: <b id="activeTemplateName">Custom</b></p>
        <table>
            <thead>
                <tr>
                    <th width="30%">Control & Question</th>
                    <th width="12%">Status</th>
                    <th width="33%">Remarks</th>
                    <th width="25%">Upload Evidence</th>
                </tr>
            </thead>
            <tbody id="auditRows"></tbody>
        </table>
        <div style="margin-top: 20px;">
            <button class="btn btn-success" onclick="saveAudit()">💾 Save Assessment</button>
        </div>
    </div>
</div>

<script>
    let masterBank = []; 
    let dbVendors = {}; 
    let templates = {};
    let activeVendor = null;
    let isAdminAuthenticated = false;

    async function init() {
        // Fetch questions from database (NEW)
        const qRes = await fetch('/api/questions');
        masterBank = await qRes.json();
        
        // Render dynamic master checklist with edit buttons (NEW)
        document.getElementById('masterChecklist').innerHTML = masterBank.map(c => `
            <div class="question-item">
                <input type="checkbox" class="tpl-check" value="${c.id}">
                <span class="q-id">${c.id}</span> 
                <span>${c.name} (Weight: ${c.weight})</span>
                <button class="btn btn-edit" onclick="editQuestion('${c.id}')" title="Edit Question">✏️</button>
            </div>
        `).join('');

        // Fetch templates and vendors
        const [tRes, vRes] = await Promise.all([fetch('/api/templates'), fetch('/api/vendors')]);
        const tData = await tRes.json();
        const vData = await vRes.json();

        templates = {};
        tData.forEach(t => templates[t.name] = JSON.parse(t.controlIds));

        dbVendors = {};
        vData.forEach(v => {
            dbVendors[v.name] = { ...v, activeIds: JSON.parse(v.activeIds || '[]'), data: {} };
        });

        renderTemplates();
        renderVendors();
        updateVendorPicker();
    }

    // NEW: Edit question functionality
    async function editQuestion(id) {
        const q = masterBank.find(q => q.id === id);
        if (!q) return;
        
        const name = prompt("Control Name:", q.name);
        const question = prompt("Full Question:", q.question);
        const weight = prompt("Weight (1-5):", q.weight);
        
        if (name && question && weight !== null) {
            try {
                await fetch(`/api/questions/${id}/update`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ name, question, weight: parseInt(weight) })
                });
                alert('Question updated successfully!');
                init(); // Refresh
            } catch (err) {
                alert('Update failed: ' + err.message);
            }
        }
    }

    function setView(role) {
        document.getElementById('workspace').style.display = 'none';
        activeVendor = null;
        if(role === 'admin') {
            document.getElementById('btnAdminView').classList.add('active');
            document.getElementById('btnVendorView').classList.remove('active');
            document.getElementById('vendorSelection').classList.add('hidden');
            if(!isAdminAuthenticated) document.getElementById('adminLoginCard').classList.remove('hidden');
            else showAdminPortal();
        } else {
            isAdminAuthenticated = false;
            document.getElementById('btnVendorView').classList.add('active');
            document.getElementById('btnAdminView').classList.remove('active');
            document.getElementById('adminSection').classList.add('hidden');
            document.getElementById('adminLoginCard').classList.add('hidden');
            document.getElementById('vendorSelection').classList.remove('hidden');
            document.getElementById('adminControls').classList.add('hidden');
        }
    }

    function checkAdminAuth() {
        if(document.getElementById('adminPassInput').value === "admin123") {
            isAdminAuthenticated = true;
            showAdminPortal();
        } else alert("Wrong Password");
    }

    function showAdminPortal() {
        document.getElementById('adminLoginCard').classList.add('hidden');
        document.getElementById('adminSection').classList.remove('hidden');
        document.getElementById('adminControls').classList.remove('hidden');
    }

    async function saveTemplate() {
        const name = document.getElementById('tplName').value.trim();
        const controlIds = Array.from(document.querySelectorAll('.tpl-check:checked')).map(c => c.value);
        if(name && controlIds.length) {
            await fetch('/api/templates', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, controlIds })
            });
            document.getElementById('tplName').value = '';
            init();
        }
    }

    async function addVendor() {
        const name = document.getElementById('vName').value.trim();
        if(name) {
            await fetch('/api/vendors', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name })
            });
            document.getElementById('vName').value = '';
            init();
        }
    }

    async function deleteVendor() {
        if(activeVendor && confirm(`Delete ${activeVendor}?`)) {
            await fetch(`/api/vendors/${encodeURIComponent(activeVendor)}`, { method: 'DELETE' });
            activeVendor = null;
            document.getElementById('workspace').style.display = 'none';
            init();
        }
    }

    async function applyTemplateToActive(tName) {
        if(!activeVendor) return alert("Select a vendor card first");
        await fetch('/api/assign-template', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ vendorName: activeVendor, templateName: tName, activeIds: templates[tName] })
        });
        loadAudit(activeVendor);
    }

    async function loadAudit(name) {
        if(!name) return;
        activeVendor = name;
        
        const res = await fetch(`/api/audit/${encodeURIComponent(name)}`);
        const auditData = await res.json();
        const dataMap = {};
        auditData.forEach(r => dataMap[r.controlId] = r);
        
        dbVendors[name].data = dataMap;
        document.getElementById('workspace').style.display = 'block';
        document.getElementById('currentTitle').innerText = name;
        document.getElementById('activeTemplateName').innerText = dbVendors[name].templateName;

        const tbody = document.getElementById('auditRows');
        const activeQs = masterBank.filter(q => dbVendors[name].activeIds.includes(q.id));
        
        tbody.innerHTML = activeQs.map(q => {
            const saved = dbVendors[name].data[q.id] || { response: 'Pending', remark: '', fileName: '' };
            return `<tr>
                <td><span class="q-id">${q.id}</span> <b>${q.name}</b><br><small class="control-q">${q.question}</small></td>
                <td><select id="res-${q.id}">
                    <option value="Pending" ${saved.response==='Pending'?'selected':''}>Pending</option>
                    <option value="Pass" ${saved.response==='Pass'?'selected':''}>Pass</option>
                    <option value="Fail" ${saved.response==='Fail'?'selected':''}>Fail</option>
                </select></td>
                <td><textarea id="rem-${q.id}">${saved.remark || ''}</textarea></td>
                <td>
                    <input type="file" id="file-${q.id}">
                    ${saved.fileName ? `<br><a href="/uploads/${saved.fileName}" target="_blank">📄 View File</a>` : ''}
                </td>
            </tr>`;
        }).join('');
        renderVendors();
    }

    async function saveAudit() {
        const activeQs = masterBank.filter(q => dbVendors[activeVendor].activeIds.includes(q.id));
        const formData = new FormData();
        let responses = [];
        let totalW = 0, earnedW = 0;

        activeQs.forEach(q => {
            const res = document.getElementById(`res-${q.id}`).value;
            const rem = document.getElementById(`rem-${q.id}`).value;
            const fileInput = document.getElementById(`file-${q.id}`);
            
            if (fileInput.files[0]) formData.append(`file-${q.id}`, fileInput.files[0]);
            responses.push({ id: q.id, res, rem, existingFile: dbVendors[activeVendor].data[q.id]?.fileName || '' });

            if(res !== 'Pending') {
                totalW += q.weight;  // Now uses database weight (NEW)
                if(res === 'Pass') earnedW += q.weight;
            }
        });

        formData.append('vendorName', activeVendor);
        formData.append('score', totalW ? Math.round((earnedW/totalW)*100) : 0);
        formData.append('responses', JSON.stringify(responses));

        await fetch('/api/audit/save', { method: 'POST', body: formData });
        alert("Assessment Saved to Database!");
        init();
    }

    async function exportVendorData() {
        const { jsPDF } = window.jspdf;
        const doc = new jsPDF();
        const v = dbVendors[activeVendor];
        doc.text(`Audit Report: ${activeVendor}`, 14, 20);
        doc.text(`Score: ${v.score}% | Template: ${v.templateName}`, 14, 30);
        
        const rows = masterBank.filter(q => v.activeIds.includes(q.id)).map(q => {
            const s = v.data[q.id] || { response: 'Pending', remark: '' };
            return [q.id, q.name, s.response, s.remark];
        });

        doc.autoTable({ startY: 40, head: [['ID', 'Control', 'Status', 'Remark']], body: rows });
        doc.save(`${activeVendor}_Report.pdf`);
    }

    function renderTemplates() {
        document.getElementById('savedTemplates').innerHTML = Object.keys(templates).map(t => `
            <button class="btn" style="font-size:0.7rem; background:#dbeafe" onclick="applyTemplateToActive('${t}')">Apply ${t}</button>
        `).join('');
    }

    function renderVendors() {
        const grid = document.getElementById('vendorGrid');
        grid.innerHTML = Object.keys(dbVendors).map(name => `
            <div class="vendor-card ${activeVendor === name ? 'active' : ''}" onclick="loadAudit('${name}')">
                <strong>${name}</strong><br><small>${dbVendors[name].templateName}</small>
                <div style="color:var(--primary); font-weight:bold">${dbVendors[name].score}%</div>
            </div>
        `).join('');
        updateStats();
    }

    function updateStats() {
        const keys = Object.keys(dbVendors);
        document.getElementById('stat-count').innerText = keys.length;
        let sum = keys.reduce((a, b) => a + dbVendors[b].score, 0);
        document.getElementById('stat-avg').innerText = keys.length ? Math.round(sum/keys.length) + "%" : "0%";
    }

    function updateVendorPicker() {
        const sel = document.getElementById('vendorPicker');
        sel.innerHTML = `<option value="">-- Select Your Organization --</option>` + 
                        Object.keys(dbVendors).map(n => `<option value="${n}">${n}</option>`).join('');
    }

    init();
</script>
</body>
</html>
